[package]
name = "radii-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Radii operator CLI for probing Crawl and planning routes"

[[bin]]
name = "radii"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
radii-core = { path = "../core" }
radii-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
