[package]
name = "radii-cli"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Radii operator CLI for probing Crawl and planning routes"

[[bin]]
name = "radii"
path = "src/main.rs"

[dependencies]
anstyle = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
radii-core = { path = "../core" }
radii-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
