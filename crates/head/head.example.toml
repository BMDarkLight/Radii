[http]
bind = "0.0.0.0:8080"
# Bounds one candidate's connection setup — chain establishment plus the HTTP
# handshake for a graph-resolved backend, or the TCP dial for a static one.
attempt_timeout_ms = 3000
# Bounds waiting for response headers after the request is sent. Deliberately
# NOT a limit on body streaming: a slow large download is legitimate.
response_timeout_ms = 30000

[radii]
bind = "0.0.0.0:7000"
crawl_upstream = "127.0.0.1:7100"

[routing]
default_backend = "http://127.0.0.1:9000"

[routing.host_map]
"example.com" = "http://10.0.0.10:9000"
"static.example.com" = "http://10.0.0.11:9000"

# Optional: resolve backends from Crawl's live reachability graph instead of
# (ahead of) the static host_map above. Falls through to host_map/default
# when a host isn't in node_map or no reachable route currently exists.
[graph]
crawl_upstream = "127.0.0.1:7100"
source_node_id = "head"
poll_interval_ms = 5000
allowed_protocols = ["http"]
max_hops = 4
# How many ranked backends to plan per host. Head proxies, so it fails over
# across these itself when a chain will not open — the extras are what it
# fails over to, not just what it reports.
max_candidates = 3

# A host may name several nodes. Head plans to all of them and tries the
# reachable ones best-first. A bare string still works for a single node.
#
# Every mapped node must advertise a `relay`-role listen address (e.g.
# `--listen-addr relay=HOST:PORT`) — and so must every node a route to it
# may cross. Head reaches a backend over a source-routed chain: it dials the
# first hop, hands it the tail, and terminates at the target's relay
# listener, so every hop needs a dialable address. A path crossing a node
# that advertises none is dropped. Nothing resolves the `http` role; a node
# advertising only `http=HOST:PORT` is silently skipped, and the request
# falls through to host_map/default below.
[graph.node_map]
"example.com" = ["node-b", "node-c"]
"single.example.com" = "node-b"

# Optional: require mutual TLS for the Radii bridge listener above and for
# every outbound connection Head makes to Crawl (the bridge relay and the
# graph poller). Absent, those connections stay plaintext. See docs/tls.md.
# [tls]
# cert = "/etc/radii/head.cert.pem"
# key = "/etc/radii/head.key.pem"
# ca = "/etc/radii/ca.cert.pem"
