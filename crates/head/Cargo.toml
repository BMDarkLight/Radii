[package]
name = "radii-head"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Radii public access and control-plane bridge"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
radii-core = { path = "../core" }
radii-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
