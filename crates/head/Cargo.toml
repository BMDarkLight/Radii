[package]
name = "radii-head"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Radii public access and control-plane bridge"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
radii-core = { path = "../core" }
radii-fetch = { path = "../fetch" }
radii-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
toml = "0.8"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }
